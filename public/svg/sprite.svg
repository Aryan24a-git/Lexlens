<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- LexLens icon sprite. 24x24, stroke icons using currentColor.
       Served as an external file: do NOT add display:none to this root element.
       Usage: <svg class="size-5"><use href="/svg/sprite.svg#risk-high"/></svg>
       Risk icons have distinct SHAPES (triangle / circle / shield / dot) so risk never relies on colour alone. -->

  <symbol id="upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
