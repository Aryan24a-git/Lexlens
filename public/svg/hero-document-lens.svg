<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" fill="none" role="img" aria-label="A contract page with risk-coloured index tabs and a magnifying lens over a highlighted clause" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Landing fallback / mobile hero / OG-image base. Transparent background; place on baize. -->
  <defs>
    <filter id="paperShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#04120F" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="brass" x1="300" y1="200" x2="560" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCC58C"/>
      <stop offset="1" stop-color="#A9843A"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="420" cy="330" r="92"/></clipPath>
  </defs>

  <!-- page -->
  <rect x="110" y="40" width="400" height="520" rx="2" fill="#F2EFE6" filter="url(#paperShadow)"/>
  <rect x="110" y="40" width="400" height="520" rx="2" stroke="#D3CCB9"/>

  <!-- heading + text lines -->
  <rect x="152" y="86" width="190" height="14" rx="2" fill="#16211F" opacity="0.85"/>
  <g fill="#16211F" opacity="0.22">
    <rect x="152" y="124" width="320" height="8" rx="2"/>
    <rect x="152" y="144" width="300" height="8" rx="2"/>
    <rect x="152" y="164" width="316" height="8" rx="2"/>
    <rect x="152" y="184" width="240" height="8" rx="2"/>
  </g>

  <!-- highlighted clause (auto-renewal) -->
  <rect x="146" y="222" width="336" height="58" fill="#E9B824" opacity="0.30"/>
  <g fill="#16211F" opacity="0.5">
    <rect x="152" y="230" width="318" height="8" rx="2"/>
    <rect x="152" y="250" width="322" height="8" rx="2"/>
    <rect x="152" y="270" width="200" height="8" rx="2"/>
  </g>

  <g fill="#16211F" opacity="0.22">
    <rect x="152" y="308" width="310" height="8" rx="2"/>
    <rect x="152" y="328" width="322" height="8" rx="2"/>
    <rect x="152" y="348" width="270" height="8" rx="2"/>
    <rect x="152" y="386" width="318" height="8" rx="2"/>
    <rect x="152" y="406" width="296" height="8" rx="2"/>
    <rect x="152" y="426" width="322" height="8" rx="2"/>
    <rect x="152" y="446" width="180" height="8" rx="2"/>
    <rect x="152" y="484" width="310" height="8" rx="2"/>
    <rect x="152" y="504" width="250" height="8" rx="2"/>
  </g>

  <!-- gutter stamps (Bates-style) -->
  <g font-family="'Public Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#8C6F35" letter-spacing="0.4">
    <text x="122" y="132">C1</text>
    <text x="122" y="238">C4</text>
    <text x="122" y="316">C5</text>
    <text x="122" y="394">C6</text>
    <text x="122" y="492">C7</text>
  </g>

  <!-- index tabs (risk): high / medium / low — icon shapes differ, not just colour -->
  <g>
    <path d="M510 222h28a4 4 0 0 1 4 4v42a4 4 0 0 1-4 4h-28z" fill="#A8323A"/>
    <path d="M524 234l10 18h-20z" stroke="#F2EFE6" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M524 241v5M524 249v.01" stroke="#F2EFE6" stroke-width="1.8" stroke-linecap="round"/>

    <path d="M510 306h28a4 4 0 0 1 4 4v42a4 4 0 0 1-4 4h-28z" fill="#E9B824"/>
    <circle cx="524" cy="331" r="9" stroke="#16211F" stroke-width="1.8"/>
    <path d="M524 326v5M524 335v.01" stroke="#16211F" stroke-width="1.8" stroke-linecap="round"/>

    <path d="M510 392h28a4 4 0 0 1 4 4v42a4 4 0 0 1-4 4h-28z" fill="#2F8F74"/>
    <path d="M524 405l8 3v6c0 4-3 7-8 8-5-1-8-4-8-8v-6z" stroke="#F2EFE6" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="m520.5 415 2.5 2.5 4-4.5" stroke="#F2EFE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lens -->
  <circle cx="420" cy="330" r="92" fill="#DCC58C" fill-opacity="0.16"/>
  <g clip-path="url(#lensClip)">
    <rect x="330" y="280" width="200" height="34" fill="#E9B824" opacity="0.38"/>
    <g fill="#16211F" opacity="0.7">
      <rect x="338" y="286" width="170" height="11" rx="2"/>
      <rect x="338" y="304" width="150" height="11" rx="2"/>
    </g>
    <g fill="#16211F" opacity="0.28">
      <rect x="338" y="336" width="180" height="11" rx="2"/>
      <rect x="338" y="356" width="130" height="11" rx="2"/>
      <rect x="338" y="254" width="150" height="11" rx="2"/>
    </g>
  </g>
  <circle cx="420" cy="330" r="92" stroke="url(#brass)" stroke-width="9"/>
  <path d="M486 396 L556 466" stroke="url(#brass)" stroke-width="15" stroke-linecap="round"/>
  <path d="M352 292 A80 80 0 0 1 410 248" stroke="#F2EFE6" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
</svg>
